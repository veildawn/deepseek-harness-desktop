name: Desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Desktop semantic version
        required: true
        default: 0.1.0-rc.6
      harness_version:
        description: Published @deepseek-ai/dsh version to bundle
        required: true
        default: 0.1.0-rc.6
      release_tag:
        description: Downstream release tag (defaults to desktop-v<version>)
        required: false
      upstream_tag:
        description: Optional DeepSeek Harness release tag represented by this build
        required: false
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release
    runs-on: ubuntu-latest
    outputs:
      harness_version: ${{ steps.release.outputs.harness_version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      should_build: ${{ steps.release.outputs.should_build }}
      upstream_tag: ${{ steps.release.outputs.upstream_tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve manual or upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_HARNESS_VERSION: ${{ inputs.harness_version }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
            harness_version="$INPUT_HARNESS_VERSION"
            upstream_tag="$INPUT_UPSTREAM_TAG"
            release_tag="${INPUT_RELEASE_TAG:-desktop-v${version}}"
          else
            if ! release_json=$(gh api repos/deepseek-ai/deepseek-harness/releases/latest 2>/dev/null); then
              echo "DeepSeek Harness has no GitHub release yet; nothing to publish."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            upstream_tag=$(jq -r '.tag_name' <<< "$release_json")
            manifest=$(gh api "repos/deepseek-ai/deepseek-harness/contents/apps/cli/package.json?ref=${upstream_tag}" --jq '.content' | tr -d '\n' | base64 --decode)
            harness_version=$(jq -r '.version' <<< "$manifest")
            version="$harness_version"
            release_tag="desktop-v${version}"
          fi

          version_pattern='^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$'
          if [[ ! "$version" =~ $version_pattern || ! "$harness_version" =~ $version_pattern ]]; then
            echo "Invalid desktop or Harness semantic version." >&2
            exit 1
          fi
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; nothing to publish."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "should_build=true"
            echo "version=$version"
            echo "harness_version=$harness_version"
            echo "release_tag=$release_tag"
            echo "upstream_tag=$upstream_tag"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            command: dist:mac
            artifact: desktop-macos-arm64
          - name: Windows x64
            runner: windows-2025
            command: dist:win
            artifact: desktop-windows-x64
    runs-on: ${{ matrix.runner }}
    env:
      DSH_HARNESS_VERSION: ${{ needs.prepare.outputs.harness_version }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      CSC_LINK: ${{ matrix.command == 'dist:mac' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ matrix.command == 'dist:mac' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set release version
        shell: bash
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const path = 'apps/desktop/package.json'; const manifest = JSON.parse(fs.readFileSync(path, 'utf8')); manifest.version = process.env.RELEASE_VERSION; fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n')"
      - name: Test desktop host
        run: pnpm --filter @deepseek-ai/dsh-desktop test
      - name: Build release
        shell: bash
        run: |
          if [[ -z "${CSC_LINK:-}" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          if [[ -z "${APPLE_ID:-}" ]]; then
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          pnpm --filter @deepseek-ai/dsh-desktop ${{ matrix.command }}
      - name: Verify updater metadata
        shell: bash
        run: |
          if [[ "${{ matrix.command }}" == "dist:mac" ]]; then
            test -f apps/desktop/dist/release/latest-mac.yml
            test -n "$(find apps/desktop/dist/release -maxdepth 1 -name '*.dmg' -print -quit)"
            test -n "$(find apps/desktop/dist/release -maxdepth 1 -name '*.zip' -print -quit)"
          else
            test -f apps/desktop/dist/release/latest.yml
            test -n "$(find apps/desktop/dist/release -maxdepth 1 -name '*.exe' -print -quit)"
            test -n "$(find apps/desktop/dist/release -maxdepth 1 -name '*.blockmap' -print -quit)"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/dist/release/*.dmg
            apps/desktop/dist/release/*.zip
            apps/desktop/dist/release/*.exe
            apps/desktop/dist/release/latest*.yml
            apps/desktop/dist/release/*.blockmap

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HARNESS_VERSION: ${{ needs.prepare.outputs.harness_version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: release-assets
      - name: Create checksums and release notes
        shell: bash
        run: |
          cd release-assets
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cd ..
          upstream_line="Official runtime: @deepseek-ai/dsh ${HARNESS_VERSION}"
          if [[ -n "$UPSTREAM_TAG" ]]; then
            upstream_line="Official release: https://github.com/deepseek-ai/deepseek-harness/releases/tag/${UPSTREAM_TAG}"
          fi
          cat > release-notes.md <<EOF
          DeepSeek Harness desktop ${RELEASE_VERSION}

          ${upstream_line}

          - macOS Apple Silicon: DMG for installation and ZIP for automatic updates
          - Windows x64: NSIS installer with blockmap-based differential updates
          - Update metadata and SHA-256 checksums are attached to this release

          macOS automatic installation requires a signed build. Unsigned builds fall back to the release download page.
          EOF
      - name: Publish release
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DeepSeek Harness ${RELEASE_VERSION}" \
            --notes-file release-notes.md
